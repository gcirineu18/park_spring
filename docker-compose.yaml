
version: '3.8'

services:
  app:
    image: 'parking-spring:1.0'              
    build: .
    depends_on:
         - db
    environment:
        - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/demo_park
        - SPRING_DATASOURCE_USERNAME=postgres
        - SPRING_DATASOURCE_PASSWORD=123456
        - SPRING_JPA_HIBERNATE_DDL_AUTO=update 
    ports: 
        - "8080:8080"         

  db:
    image: 'postgres:13.1-alpine'
    
    environment:
       - POSTGRES_USER=postgres
       - POSTGRES_PASSWORD=123456
       - POSTGRES_DB=demo_park 
    ports: 
       - "5432:5432" 

